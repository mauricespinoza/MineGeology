<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>GeoMapper Chile</title>
    <link rel="stylesheet" href="/src/ui/style.css" />
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="hud" hidden>
      <div id="hud-top">
        <div class="panel" id="clock"></div>
        <div class="panel" id="coords"></div>
        <div class="panel" id="compass"></div>
      </div>
      <div class="panel" id="prompt" hidden></div>
      <button class="panel" id="work-button" type="button" hidden>Trabajar aquí (E)</button>
      <div id="hud-buttons">
        <button class="panel" id="notebook-button" type="button">Libreta (N)</button>
        <button class="panel" id="net-button" type="button">Estereograma (S)</button>
        <button class="panel" id="map-button" type="button">Mapa (M)</button>
      </div>
      <div id="crosshair"></div>
    </div>
    <div id="map" hidden></div>
    <aside class="sheet" id="field-panel" hidden></aside>
    <aside class="sheet wide" id="notebook" hidden></aside>
    <aside class="sheet wide" id="stereonet" hidden></aside>
    <div id="overlay">
      <div id="overlay-box">
        <h1 id="overlay-title">GeoMapper Chile</h1>
        <p id="overlay-text">Cargando el escenario…</p>
        <button id="overlay-button" type="button" hidden>Comenzar</button>
        <button id="overlay-second" type="button" hidden></button>
        <p id="overlay-help" hidden>
          Caminar: W A S D o flechas · Mirar: ratón · Trabajar en un afloramiento: E · Libreta: N · Mapa: M · Red estereográfica: S<br />
          En pantalla táctil: arrastra a la izquierda para caminar y a la derecha para mirar.
        </p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
