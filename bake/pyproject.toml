[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geomapper-bake"
version = "0.1.0"
description = "Bakes GemPy geological models into static GeoMapper scenarios"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.18", "numpy>=1.26", "scipy>=1.11", "pyyaml>=6", "gempy>=2025.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
geomapper = "geomapper_bake.cli:main"

[tool.setuptools]
packages = ["geomapper_bake"]

[tool.pytest.ini_options]
testpaths = ["tests"]
