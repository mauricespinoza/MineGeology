  - {type: intrusion, rank: 3, label: Intrusión de la granodiorita, units: [granodiorita]}
  - {type: metamorphism, rank: 3, label: Metamorfismo de contacto (aureola de corneanas), units: [corneanas]}
  - {type: uplift, rank: 4, label: Alzamiento y erosión del basamento y del plutón}
  - {type: deposition, rank: 5, label: Depósito de la cubierta triásica, units: [conglomerados, areniscas]}
  - {type: tilting, rank: 6, label: Basculamiento suave de la cubierta}

