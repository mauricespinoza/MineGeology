units:
  basement:
    key: u17
    name: Calizas Lo Encañado
    age: {label: Jurásico Medio (Bajociano a Calloviano), from_ma: 170, to_ma: 161}
    rock_class: sedimentary
    lithology: caliza y lutita calcárea
    colour: "#8d9aa3"
    texture: limestone
    resistance: 0.7
    description:
      field: Caliza gris azulada en bancos de 0,2 a 1 m alternada con lutita calcárea negra; huele a petróleo al golpearla.
      hand_lens: Caliza micrítica con fragmentos de conchas y artejos de crinoideos; reacciona con fuerza al ácido.
    fossils:
      - Amonites del Jurásico Medio
      - Bivalvos (Gryphaea)
    features:
      - Bancos de caliza con conchas de bivalvos
      - Nódulos calcáreos en lutitas negras
      - Pliegues menores en las lutitas
    way_up: [graded_bedding, load_casts]
    thin_section: Wackestone bioclástico. Fragmentos de bivalvos, equinodermos y foraminíferos bentónicos en micrita; estilolitas paralelas a la estratificación.
  yeso:
    key: u04
    name: Yeso del Valle Blanco
    age: {label: Jurásico Superior (Oxfordiano), from_ma: 161, to_ma: 155}
    thickness_m: 130
    rock_class: evaporite
    lithology: yeso y anhidrita
    colour: "#ece8df"
    texture: gypsum
    resistance: 0.15
    description:
      field: Yeso blanco a gris, laminado y muy plegado internamente; forma lomas redondeadas y dolinas.
      hand_lens: Cristales de yeso que se rayan con la uña, en láminas finas con niveles grises de anhidrita.
    features:
      - Laminación plegada de forma caótica
      - Dolinas en la superficie del yeso
    thin_section: Yeso alabastrino y porfiroblástico con relictos de anhidrita; láminas de arcilla y dolomita.
  capas_rojas:
    key: u10
    name: Capas Rojas Río Morado
    age: {label: Jurásico Superior (Kimmeridgiano), from_ma: 155, to_ma: 150}
    thickness_m: 220
    rock_class: sedimentary
    lithology: conglomerado y arenisca roja
    colour: "#a4553f"
    texture: redbeds
    resistance: 0.6
    description:
      field: Arenisca y conglomerado rojo en bancos lenticulares, con niveles de lutita roja y grietas de desecación.
      hand_lens: Arena media a gruesa de clastos volcánicos y cuarzo, con cemento de hematita.
    features:
      - Estratificación cruzada en artesa
      - Grietas de desecación en lutitas rojas
      - Canales de conglomerado con base erosiva
    way_up: [cross_bedding, scour_marks]
    thin_section: Arenisca lítica volcánica. Fragmentos de andesita y plagioclasa con pátinas de hematita; cemento de calcita.
  calizas_titonianas:
    key: u13
    name: Calizas Lo Valle
    age: {label: Jurásico Superior a Cretácico Inferior (Titoniano a Hauteriviano), from_ma: 150, to_ma: 132}
    thickness_m: 400
    rock_class: sedimentary
    lithology: caliza y lutita con amonites
    colour: "#b3a88f"
    texture: limestone
    resistance: 0.55
    description:
      field: Caliza gris clara y lutita calcárea en capas delgadas y regulares, con amonites aplastados en los planos de estratificación.
      hand_lens: Caliza micrítica y lutita calcárea finamente laminada; algunos bancos arenosos con gradación.
    fossils:
      - Amonites del Titoniano (Substeueroceras)
      - Amonites del Valanginiano
    features:
      - Amonites aplastados en los planos de estratificación
      - Capas delgadas y regulares de caliza y lutita
    way_up: [graded_bedding, load_casts]
    thin_section: Mudstone a wackestone con radiolarios y calpionélidos; láminas de arcilla.

