name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bake:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bake
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bake/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest
      - run: geomapper validate ../format/examples/toy
      - run: geomapper bake tests/scenarios/faulted_cover --report --out ../build/faulted

  game:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            game/package-lock.json
      # The server imports the game's loader and grader, so the game's packages are needed too.
      - run: npm ci
        working-directory: game
      - run: npm ci
        working-directory: server
      - run: npm run typecheck
        working-directory: server
      - run: npm test
        working-directory: server
      - run: npm run build
        working-directory: server
      - run: npm run build:graded
        working-directory: game
